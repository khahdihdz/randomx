name: Deploy RandomX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate static site
        run: |
          test -s index.html
          grep -q 'crypto.getRandomValues' index.html
          grep -q 'RandomX' index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.find('<script>') + len('<script>')
          end = html.find('</script>', start)
          assert start >= len('<script>') and end > start, 'Inline JavaScript block not found'
          Path('/tmp/randomx-check.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/randomx-check.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
