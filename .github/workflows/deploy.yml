name: Deploy RandomX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate static site
        run: |
          test -s index.html
          grep -q 'crypto.getRandomValues' index.html
          grep -q 'RandomX' index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html' in html.lower(), 'HTML document tag not found'
          assert '<script' in html.lower() and '</script>' in html.lower(), 'JavaScript block not found'
          assert 'crypto.getRandomValues' in html, 'Secure random generator not found'
          print('Static site validation passed')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
